name: MoonClub
options:
  bundleIdPrefix: com.mutaafaziz
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  MoonClubCore: { path: Packages/MoonClubCore }
settings:
  base:
    DEVELOPMENT_TEAM: Z73865R687
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MoonClub:
    type: application
    platform: iOS
    sources: [MoonClub]
    dependencies: [{ package: MoonClubCore }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mutaafaziz.moonclub
        PRODUCT_NAME: MoonClub
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moon Club
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
  MoonClubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MoonClubTests]
    dependencies: [{ target: MoonClub }, { package: MoonClubCore }]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: com.mutaafaziz.moonclub.tests } }
schemes:
  MoonClub:
    build: { targets: { MoonClub: all, MoonClubTests: [test] } }
    test: { targets: [MoonClubTests, { package: MoonClubCore/MoonClubCoreTests }] }
